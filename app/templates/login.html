<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş · AvITData Ağ İzleme</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="panel login-panel" aria-labelledby="login-title">
        <p class="eyebrow">AvITData · Yerel prototip</p>
        <h1 id="login-title">Oturum açın</h1>
        <p class="subtitle">Kurumsal Ağ İzleme sistemine devam edin.</p>
        {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label>
            Kullanıcı adı
            <input name="username" minlength="3" maxlength="64" autocomplete="username" required autofocus>
          </label>
          <label>
            Parola
            <input name="password" type="password" maxlength="128" autocomplete="current-password" required>
          </label>
          <button class="button primary" type="submit">Giriş yap</button>
        </form>
        <small>Hesaplar yalnızca yerel yönetim komutuyla oluşturulur.</small>
      </section>
    </main>
  </body>
</html>
