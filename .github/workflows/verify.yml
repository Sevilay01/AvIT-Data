name: Verify source delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build source-only ZIP
        run: python -m scripts.package --output source.zip
      - name: Verify ZIP in separate runtime and development environments
        run: >-
          python -m scripts.verify delivery --archive source.zip
          --work-dir acceptance --evidence acceptance-result.json
      - name: Install optional Chromium acceptance tools
        if: matrix.os == 'ubuntu-latest'
        run: >-
          acceptance/development-venv/bin/python -m pip install
          -r acceptance/source/requirements-browser.txt
      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest'
        run: acceptance/development-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise real browser against extracted source
        if: matrix.os == 'ubuntu-latest'
        working-directory: acceptance/source
        run: >-
          ../development-venv/bin/python -m scripts.browser_smoke
          --output ../../browser-acceptance
      - name: Preserve source package and acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            source.zip
            source.verification.json
            acceptance-result.json
            acceptance/runtime-evidence.json
            acceptance/quality-evidence.json
            browser-acceptance/acceptance.json
            browser-acceptance/graph.png
            browser-acceptance/viewer-mobile.png
